      <h1>Troubleshooting</h1>
      <ul>
        <li>Check daily logs under <code>logs/</code>.</li>
        <li>Confirm elevation badge for remediations.</li>
        <li>Use Live Console stream for action errors.</li>
        <li>Verify module scripts are listed in <code>module.json</code>.</li>
        <li>If the UI is blank, hard-refresh the browser (Ctrl+F5).</li>
      </ul>
